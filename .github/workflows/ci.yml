name: CI Pipeline

on:
  push:
    branches: [ "sesi31-loadtest" ]
  pull_request:
    branches: [ "sesi31-loadtest" ]

jobs:
  lint:
    name: Run ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: npm install
      - run: npm run lint

  test:
    name: Run Unit Tests (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: npm install
      - run: npm test -- --coverage

  sonar:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    needs: [lint, test]   # jalan setelah lint & test sukses
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0   # perlu history penuh untuk analisis
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: npm install
      - name: Run SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # disediakan otomatis GitHub
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  k6:
    name: k6 Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install k6
        run: |
          sudo apt update
          sudo apt install -y gnupg software-properties-common
          curl -s https://dl.k6.io/key.gpg | sudo apt-key add -
          echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt update
          sudo apt install -y k6
      - name: Run k6 smoke test
        run: k6 run loadtest/script.js
