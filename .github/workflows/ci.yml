name: CI Pipeline

on:
  push:
    branches: [ "sesi31-loadtest" ]
  pull_request:
    branches: [ "sesi31-loadtest" ]

jobs:
  lint:
    name: Run ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: npm install
      - run: npm run lint

  test:
    name: Run Unit Tests (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: npm install
      - run: npm test -- --coverage

  sonar:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    needs: [lint, test]   # jalan setelah lint & test sukses
    steps:
